name: Generate GitHub Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark&color_snake=%23E5E7EB&color_dots=%2315181D,%23292E34,%23454D55,%236A747E,%239AA3AD
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23E5E7EB&color_dots=%2315181D,%23292E34,%23454D55,%236A747E,%239AA3AD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate dynamic streak statistics
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          options: >-
            user=${{ github.repository_owner }}&theme=transparent&hide_border=true&background=111318&border=343A40&stroke=343A40&ring=9AA3AD&fire=E5E7EB&currStreakNum=F1F3F5&sideNums=D9DDE2&currStreakLabel=F1F3F5&sideLabels=D9DDE2&dates=9AA3AD&card_width=600&card_height=195&disable_animations=true
          path: dist/github-streak-stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish generated assets
        uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          target_branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
